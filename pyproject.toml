[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-attendance-camera"
version = "0.1.0"
description = "Local doorway counting and occupancy estimates for Purdue Hackers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "numpy>=2,<3",
  "onnxruntime>=1.31,<2",
  "opencv-python>=4.12,<5",
  "supervision>=0.31.5,<0.32",
  "trackers>=2.7,<2.8",
]

[project.scripts]
attendance-server = "attendance_camera.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/attendance_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

name: Check project artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_config.py -v
      - run: python scripts/check_artifacts.py
      - run: bash -n install/install.sh
      - name: Check Python syntax without importing Fusion
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/attendance_camera tests/test_counting.py tests/test_store.py tests/test_server.py tests/test_vision.py
